$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "cliente.prueba@torbellino.com",
      "password": "cliente123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login exitoso (200)', function () {
          pm.response.to.have.status(200);
      });
      if (pm.response.code === 200) {
          const body = pm.response.json();
          pm.collectionVariables.set('clienteToken', body.token);
          pm.collectionVariables.set('clienteId', body.id);
      }
    language: text/javascript
order: 2000
