$kind: http-request
name: Cliente intenta crear producto -> debe dar 403
url: "{{baseUrl}}/api/admin/productos"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "nombre": "Producto no autorizado",
      "precio": 1000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Debe ser rechazado (403)', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 1000
